    <div class="spk-item" data-kind="turn" data-id="t${si}" data-pat="${esc(s.p)}" data-y="${esc(s.y)}"><div class="qh"><span><span class="note">Your turn!</span> ${esc(s.y)}</span><span class="sp"></span><button class="mini recbtn" data-act="rec">🎤 Nói câu của bé</button></div><div class="best">${best["t"+si]!=null?"Điểm cao nhất: "+best["t"+si]:""}</div><div class="sres"></div></div></div>`;});
  const V=vocab(L);
  if(V.length)h+=`<div class="box"><h3>📚 Từ vựng của bài</h3><div class="vgrid">${V.map((w,i)=>row("w"+i,w,"word")).join("")}</div></div>`;
  return h+nextBtn(L,"sp");}
async function startRec(){if(NOREC||!navigator.mediaDevices||!window.MediaRecorder)return null;
  const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st),ch=[];
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
  const done=new Promise(res=>{mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());res(ch.length?new Blob(ch,{type:mr.mimeType||"audio/webm"}):null);};});
  mr.start();return {mr,done};}
function saveBest(it,sc){const n=CUR.L.n,id=it.dataset.id,p=PROG[n]||(PROG[n]={});p.spk=p.spk||{};
  if(p.spk[id]==null||sc>p.spk[id]){p.spk[id]=sc;save("elp-prog",PROG);}it.querySelector(".best").textContent="Điểm cao nhất: "+p.spk[id];}
function sentHTML(it,alts){const text=it.dataset.t,toks=text.split(/\s+/),T=[],own=[];
  toks.forEach((tk,ti)=>words(tk).forEach(w=>{T.push(w);own.push(ti);}));
  let b=null;for(const a of alts){const ok=align(T,words(a.t)),acc=T.length?ok.filter(Boolean).length/T.length:0,sc=Math.round(100*(a.c>0?0.85*acc+0.15*a.c:acc));if(!b||sc>b.sc)b={sc,ok,a};}
  const tokOk=toks.map((_,ti)=>own.every((o,k)=>o!==ti||b.ok[k]));
  saveBest(it,b.sc);tone(b.sc>=70);
  const st=b.sc>=90?"⭐⭐⭐":b.sc>=70?"⭐⭐☆":b.sc>=40?"⭐☆☆":"☆☆☆";
  const msg=b.sc>=90?"Excellent! Tuyệt vời!":b.sc>=70?"Good job! Khá lắm!":b.sc>=40?"Nice try! Cố thêm chút nữa nhé!":"Let's try again! Nghe mẫu rồi nói lại nhé!";
  return `<div class="score">${b.sc}/100 ${st} <span class="note">${msg}</span></div><div>${toks.map((t,i)=>`<span class="${tokOk[i]?"wd-ok":"wd-miss"}">${esc(t)}</span>`).join(" ")}</div><div class="note">AI nghe được: “${esc(b.a.t)}”${tokOk.includes(false)?" · Từ gạch đỏ: AI chưa nghe rõ, bé luyện lại nhé.":""}</div>`;}
function patKeys(p){const ks=p.replace(/\?/g,"").split("~").map(s=>s.trim()).filter(Boolean).map(s=>s==="ing"?["*ing"]:words(s));
  if(ks[0]&&ks[0][0]==="be"&&ks[0].length>1)ks[0]=ks[0].slice(1);return ks;}
function hasPat(W,keys){let pos=0;for(const k of keys){let f=-1;
  for(let j=pos;j<W.length&&f<0;j++){if(k[0]==="*ing"){if(W[j].endsWith("ing"))f=j;}else if(k.every((w,x)=>W[j+x]&&eqW(w,W[j+x])))f=j;}
  if(f<0)return false;pos=f+(k[0]==="*ing"?1:k.length);}return true;}
function turnHTML(it,alts){const p=it.dataset.pat,keys=patKeys(p),kl=keys.reduce((s,k)=>s+k.length,0);let b=null;
  for(const a of alts){const W=words(a.t),ok=hasPat(W,keys),sc=ok&&W.length>=kl+2?100:ok?70:W.length?40:0;if(!b||sc>b.sc)b={sc,ok,a};}
  saveBest(it,b.sc);tone(b.ok);
  return `<div class="score">${b.sc>=100?"⭐⭐⭐":b.sc>=70?"⭐⭐☆":"⭐☆☆"} ${b.ok?"Bé đã dùng đúng mẫu “"+esc(p)+"”. Good job!":"Chưa nghe thấy mẫu “"+esc(p)+"”. Thử lại theo khung: "+esc(it.dataset.y)}</div><div class="note">AI nghe được: “${esc(b.a.t)}” ${sayBtn([b.a.t])}</div>`;}
function showResult(it,alts,err,blob){const out=it.querySelector(".sres");let h="";
  if(alts&&alts.length)h=it.dataset.kind==="turn"?turnHTML(it,alts):sentHTML(it,alts);
  else{const M={"no-speech":"AI chưa nghe thấy gì. Bé nói to, rõ và gần micro hơn nhé.","not-allowed":"Chưa được phép dùng micro. Bấm biểu tượng micro/ổ khóa trên thanh địa chỉ để cho phép.","service-not-allowed":"Trình duyệt chặn dịch vụ nhận giọng ở trang này.","network":"Chấm AI cần mạng nhưng đang mất kết nối.","offline":"Đang offline nên chưa chấm AI được.","nosr":"Trình duyệt này không có nhận giọng nói (dùng Chrome/Edge để chấm AI).","nomic":"Không mở được micro. Kiểm tra quyền micro của trình duyệt.","audio-capture":"Máy này không vừa ghi âm vừa nhận giọng cùng lúc được. Bấm 🎤 lần nữa: app chỉ chấm AI, không giữ bản ghi."};
    h=`<div class="note">⚠️ ${M[err]||"Chưa nhận được kết quả ("+esc(err||"?")+")."}</div>`;
    if(blob)h+=`<div class="note">Bố mẹ nghe bản ghi, so với mẫu 🔊 rồi chấm giúp bé:</div><button class="mini" data-act="selfrate" data-v="100">😀 Tốt</button> <button class="mini" data-act="selfrate" data-v="70">🙂 Khá</button> <button class="mini" data-act="selfrate" data-v="40">😐 Cần luyện thêm</button>`;}
  if(blob){if(it._u)URL.revokeObjectURL(it._u);it._u=URL.createObjectURL(blob);h+=`<div class="pb">▶ Giọng của bé: <audio controls src="${it._u}"></audio></div>`;}
  out.innerHTML=h;}

function vLesson(L,tab){return `<div style="--c:${L.c}"><div class="lhead"><button class="btn ghost" data-go="home">← Bài học</button><div><div class="note">${esc(L.u)} · sách trang ${L.pg}</div><h2>Lesson ${L.n}: ${esc(L.t)}</h2></div></div>
<div class="tabs">${ORD.map(k=>`<button class="tab ${k===tab?"on":""}" data-go="L${L.n}-${k}">${TABN[k]}</button>`).join("")}</div>${{ex:vEx,sp:vSp,pr:vPr,mt:vMt,dt:vDt}[tab](L)}</div>`;}

function vAudio(){const rows=[];for(let t=1;t<=24;t++)rows.push(`<tr><td><b>${pad(t)}</b></td><td>${esc(TL[t])}</td><td id="st${t}">…</td><td style="white-space:nowrap"><button class="mini" data-act="ptest" data-t="${t}">▶</button> <label class="mini">Gán file<input type="file" accept="audio/*,.mp3" hidden data-ov="${t}"></label> <button class="mini" data-act="ovdel" data-t="${t}" title="Bỏ gán tay">↺</button></td></tr>`);
return `<div style="--c:#ec4899"><h2>🎧 Cài đặt âm thanh</h2>
<div class="box"><b>Làm một lần (chỉ lúc này cần mạng):</b><ol>
<li>Mở các link Google Drive ở cuối trang, tải về máy các file <b>Track NNN.mp3</b> (nên tải hết vào một thư mục).</li>
<li>Bấm <b>Chọn file audio</b>, chọn tất cả file vừa tải (chọn nhiều file cùng lúc được).</li>
<li>App lưu audio vào bộ nhớ trình duyệt trên máy này. Từ đó dùng offline.</li></ol>
<label class="btn">📂 Chọn file audio<input type="file" id="fAll" accept="audio/*,.mp3,.m4a,.wav" multiple hidden></label> <span id="loadMsg" class="note"></span>
<p class="note" id="stored"></p></div>
<div class="box"><b>Ghép số track</b><p class="note">App ghép theo số trong tên file: "Track 005.mp3" dùng cho bài in số 005 trong sách. Lesson 9–16 chỉ dùng số 001–024, trong khi Drive có 50 file, nên số trên đĩa có thể khác số in trong sách. Nếu nghe thấy không khớp, nhập <b>độ lệch</b> (ví dụ sách 001 = file 025 thì nhập 24) hoặc gán file riêng cho từng track ở bảng dưới.</p>
Độ lệch: <input type="number" id="offIn" value="${+SET.off||0}" style="width:80px;font:inherit"></div>
<div class="box"><b>24 track dùng trong app</b><table>${rows.join("")}</table></div>
<div class="box"><b>🗣️ Giọng máy (dự phòng)</b><br>Tốc độ đọc: <input type="range" id="rateIn" min="0.5" max="1.1" step="0.05" value="${SET.rate}"> <span id="rateV">${SET.rate}</span>
<p class="note">Dùng giọng đọc có sẵn của thiết bị, chỉ đọc được những câu có lời thoại in trong sách. Một số máy cần cài sẵn giọng tiếng Anh mới đọc được khi offline.</p></div>
<details class="box"><summary><b>🔗 50 link audio trên Google Drive</b> (cần mạng)</summary><ol>${DRIVE.map(id=>`<li><a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Mở file</a> · <a href="https://drive.google.com/uc?export=download&id=${id}" target="_blank" rel="noopener">Tải trực tiếp</a></li>`).join("")}</ol></details>
<div class="box"><button class="btn ghost" data-act="clearall">🗑️ Xóa toàn bộ audio đã lưu</button></div></div>`;}
async function mountAudioSettings(){try{for(let t=1;t<=24;t++){const el=$("#st"+t);if(!el)continue;const o=await idbGet("o:"+t),f=o?null:await idbGet("f:"+(t+(+SET.off||0)));
  el.innerHTML=o?`✅ ${esc(o.name)} <span class="note">(gán tay)</span>`:f?`✅ ${esc(f.name)}`:"❌ chưa có";}
  const ks=(await idbKeys()).map(String).filter(k=>k.startsWith("f:")).map(k=>+k.slice(2)).sort((a,b)=>a-b);
  const s=$("#stored");if(s)s.textContent=ks.length?`Đã lưu ${ks.length} file: `+ks.map(pad).join(", "):"Chưa lưu file nào.";}
  catch(e){const s=$("#stored");if(s)s.textContent="Trình duyệt chặn bộ nhớ IndexedDB. Hãy mở file bằng Chrome hoặc Edge.";}}

function render(){
  try{if("speechSynthesis" in window)speechSynthesis.cancel();}catch(e){}
  SAY=[];const h=location.hash.slice(1)||"home";
  if(h==="audio"){app.innerHTML=vAudio();mountAudioSettings();}
  else{const m=h.match(/^L(\d+)-(\w+)$/),L=m&&BYN[m[1]];
    if(L){const tab=ORD.includes(m[2])?m[2]:"ex";CUR={L,tab};ANS={ex:{},pr:{},mt:{}};MTDONE=false;app.innerHTML=vLesson(L,tab);mountAudio();}
    else{app.innerHTML=vHome();homeStat();}}
  window.scrollTo(0,0);}

/* ===== HÀNH ĐỘNG ===== */
const norm=v=>v.trim().toLowerCase().replace(/[.,!?;:"“”]/g,"").replace(/’/g,"'");
function judge(inp){const v=norm(inp.value),h=inp.dataset.h.toLowerCase(),a=inp.dataset.a.toLowerCase();if(a==="?")return"unk";if(!v)return"empty";const ans=a.split("/");return ans.includes(v)||(h&&ans.includes(h+v))?"ok":"bad";}
let TA=new Audio();
const ACT={
  say:a=>speak(SAY[+a.dataset.id]),
  spd:a=>{const box=a.closest(".abox"),au=box.querySelector("audio");au.playbackRate=+a.dataset.r;box.querySelectorAll("[data-act=spd]").forEach(b=>b.classList.toggle("on",b===a));},
  pick:a=>{const sec=a.dataset.sec,i=+a.dataset.i,l=a.dataset.l,box=a.closest(".item");
    if(sec==="ex"){if(box.dataset.done)return;box.dataset.done="1";const k=box.dataset.k;
      box.querySelectorAll(".opt").forEach(b=>{if(b.dataset.l===k)b.classList.add("ok");else if(b===a)b.classList.add("bad");});
      const fb=box.querySelector(".fb");fb.hidden=false;fb.querySelector(".vd").textContent=l===k?"🎉 Đúng rồi!":`💪 Chưa đúng. Đáp án là (${k}).`;tone(l===k);return;}
    if(sec==="mt"&&MTDONE)return;box.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b===a));ANS[sec][i]=l;},
  prdone:()=>{const n=CUR.L.pr.items.length,s=[];for(let i=0;i<n;i++)s.push(`${i+1}-${ANS.pr[i]||"?"}`);
    $("#prres").innerHTML=`<p>Bé đã chọn: <b>${s.join(" · ")}</b></p><p class="note">Sách không in đáp án phần này. Bố mẹ nghe audio cùng bé để kiểm tra, rồi sang <b>Kiểm tra</b> để chấm điểm tự động.</p>`;tone(true);},
  mtsub:()=>{if(MTDONE)return;const L=CUR.L,boxes=[...app.querySelectorAll('.item[data-sec="mt"]')],miss=boxes.filter((b,i)=>!ANS.mt[i]).length;
    if(miss&&!confirm(`Còn ${miss} câu chưa chọn. Vẫn nộp bài?`))return;MTDONE=true;let s=0,t=0;
    boxes.forEach((box,i)=>{const k=box.dataset.k,a=ANS.mt[i],u=box.dataset.u,note=u?" (đáp án suy luận – nên đối chiếu tranh/audio)":"";
      box.querySelectorAll(".opt").forEach(b=>{b.classList.remove("sel");if(k&&b.dataset.l===k)b.classList.add("ok");else if(b.dataset.l===a)b.classList.add(k?"bad":"sel");});
      const fb=box.querySelector(".fb"),vd=fb.querySelector(".vd");fb.hidden=false;
      if(!k){vd.textContent=`⚠️ Bé chọn (${a||"–"}). Câu này chưa xác định được đáp án từ sách – bố mẹ xem tranh trang ${L.mt.pg} và nghe audio để chấm.`;return;}
      t++;if(a===k){s++;vd.textContent="✅ Đúng rồi!"+note;}else vd.textContent=`❌ Chưa đúng. Đáp án (${k}).`+note;});
    const p=PROG[L.n]||{};p.mt={s,t};PROG[L.n]=p;save("elp-prog",PROG);const r=t?s/t:0;
    $("#mtres").innerHTML=`<div class="res">${r===1?"🏆":r>=0.6?"🌟":"💪"} Bé đúng <b>${s}/${t}</b> câu ${stars(r)}</div><button class="btn" data-act="redo">↺ Làm lại</button> <button class="btn ghost" data-go="L${L.n}-dt">Sang Chính tả →</button>`;tone(r>=0.6);},
  dtcheck:()=>{const L=CUR.L;let s=0,t=0;app.querySelectorAll(".blank input").forEach(inp=>{const r=judge(inp);inp.classList.remove("ok","bad","unk");
      if(r==="ok"){s++;t++;inp.classList.add("ok");}else if(r==="bad"){t++;inp.classList.add("bad");}else if(r==="empty")t++;else inp.classList.add("unk");});
    const p=PROG[L.n]||{};p.dt={s,t};PROG[L.n]=p;save("elp-prog",PROG);const r=t?s/t:0;
    $("#dtres").innerHTML=`<div class="res">${r===1?"🏆":r>=0.6?"🌟":"💪"} Đúng <b>${s}/${t}</b> ô ${stars(r)}</div><p class="note">Ô vàng: chưa có đáp án chuẩn, không tính điểm.</p>`;tone(r>=0.6);},
  dtshow:()=>app.querySelectorAll(".blank input").forEach(inp=>{const a=inp.dataset.a;if(a==="?"){inp.placeholder="nghe audio";inp.classList.add("unk");}else inp.value=a.split("/")[0];}),
  redo:()=>render(),
  ptest:async a=>{const u=await trackURL(+a.dataset.t);if(!u){alert("Track này chưa có file.");return;}if(TA.src===u&&!TA.paused){TA.pause();return;}TA.src=u;TA.play();},
  ovdel:async a=>{await idbDel("o:"+a.dataset.t);resetURL();mountAudioSettings();},
  clearall:async()=>{if(!confirm("Xóa toàn bộ audio đã lưu trên máy này?"))return;await idbClear();resetURL();mountAudioSettings();},
  selfrate:a=>{const it=a.closest(".spk-item");saveBest(it,+a.dataset.v);tone(+a.dataset.v>=70);},
  srinstall:async a=>{a.disabled=true;a.textContent="Đang tải…";try{if(SR.install)await SR.install({langs:["en-US"],processLocally:true});else await SR.installOnDevice("en-US");await checkLocal();render();}catch(e){alert("Máy hoặc trình duyệt này chưa hỗ trợ tải bộ nhận giọng về máy.");a.disabled=false;}},
  rec:async a=>{
    if(ACTIVE){ACTIVE.stop();return;}
    const it=a.closest(".spk-item"),out=it.querySelector(".sres"),label=a.textContent;
    try{if("speechSynthesis" in window)speechSynthesis.cancel();}catch(e){}
    a.classList.add("on");a.textContent="⏹ Dừng";out.innerHTML='<span class="note">🎙️ Bé nói đi…</span>';
    let rec=null;try{rec=await startRec();}catch(e){rec=null;}
    const useAI=!!SR&&(navigator.onLine||LOCAL==="available");
    let ended=false,timer;
    const finish=async(alts,err)=>{if(ended)return;ended=true;clearTimeout(timer);ACTIVE=null;a.classList.remove("on");a.textContent=label;
      let blob=null;if(rec){try{if(rec.mr.state!=="inactive")rec.mr.stop();}catch(e){}blob=await rec.done;}
      if(err==="audio-capture"&&rec)NOREC=true;
      showResult(it,alts,err,blob);};
    if(useAI){const r=new SR();r.lang="en-US";r.interimResults=false;r.continuous=false;r.maxAlternatives=5;
      if(LOCAL==="available"){try{r.processLocally=true;}catch(e){}}
      let got=null,err=null;
      r.onresult=e=>{got=Array.from(e.results[0]).map(x=>({t:x.transcript,c:x.confidence||0}));};
      r.onerror=e=>{err=e.error;};
      r.onend=()=>finish(got,got?null:(err||"no-speech"));
      ACTIVE={stop:()=>{try{r.stop();}catch(e){finish(got,err);}}};
      try{r.start();}catch(e){finish(null,"start");return;}
    }else{if(!rec){finish(null,"nomic");return;}ACTIVE={stop:()=>finish(null,SR?"offline":"nosr")};}
    timer=setTimeout(()=>ACTIVE&&ACTIVE.stop(),12000);}
};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();const to="#"+g.dataset.go;if(location.hash===to)render();else location.hash=to;return;}
  const a=e.target.closest("[data-act]");if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e);});
const toBlob=async f=>new Blob([await f.arrayBuffer()],{type:f.type||"audio/mpeg"});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.id==="fAll"){const msg=$("#loadMsg");let ok=0;const skip=[];
    for(const f of el.files){const m=f.name.replace(/\.[^.]+$/,"").match(/\d+/);if(!m){skip.push(f.name);continue;}
      msg.textContent=`Đang lưu ${f.name}…`;try{await idbPut("f:"+parseInt(m[0],10),{name:f.name,blob:await toBlob(f)});ok++;}catch(err){skip.push(f.name+" (lỗi lưu)");}}
    resetURL();msg.textContent=`Đã lưu ${ok} file.`+(skip.length?` Bỏ qua: ${skip.join(", ")}`:"");mountAudioSettings();}
  else if(el.dataset&&el.dataset.ov){const f=el.files[0];if(!f)return;await idbPut("o:"+el.dataset.ov,{name:f.name,blob:await toBlob(f)});resetURL();mountAudioSettings();}
  else if(el.id==="offIn"){SET.off=parseInt(el.value,10)||0;save("elp-set",SET);resetURL();mountAudioSettings();}});
document.addEventListener("input",e=>{if(e.target.id==="rateIn"){SET.rate=+e.target.value;save("elp-set",SET);$("#rateV").textContent=SET.rate;}});
addEventListener("hashchange",render);

/* Hiện trang ngay; kiểm tra nhận giọng chạy nền, tối đa 1,5 giây */
render();
Promise.race([checkLocal(),new Promise(r=>setTimeout(r,1500))]).then(()=>{if(location.hash.endsWith("-sp"))render();}).catch(()=>{});
</script>
